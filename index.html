<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Art Portfolio"
  >

  <title>Art Room</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


  <!-- =====================================================
       Header
  ====================================================== -->

  <header class="site-header">

    <div class="site-title">
      ART ROOM
    </div>


    <nav class="site-nav">

      <a href="#room">
        ROOM
      </a>

      <a href="#about">
        ABOUT
      </a>

      <a href="#contact">
        CONTACT
      </a>

    </nav>

  </header>



  <!-- =====================================================
       Art Room
  ====================================================== -->

  <main id="room">

    <div id="art-space">

      <!--
        作品は JavaScript から
        自動的に生成されます。
      -->

    </div>

  </main>



  <!-- =====================================================
       Work Detail Modal
  ====================================================== -->

  <div
    id="work-modal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modal-backdrop"></div>


    <div
      class="modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >


      <!-- Close -->

      <button
        id="modal-close"
        class="modal-close"
        type="button"
        aria-label="閉じる"
      >
        ×
      </button>



      <!-- =================================================
           Media
      ================================================== -->

      <div
        id="modal-media"
        class="modal-media"
      >
      </div>



      <!-- =================================================
           Video Controls
      ================================================== -->

      <div
        id="video-controls"
        class="video-controls"
        hidden
      >

        <button
          id="video-play"
          class="video-control-button"
          type="button"
          aria-label="再生"
        >
          ▶
        </button>


        <input
          id="video-progress"
          class="video-progress"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          aria-label="再生位置"
        >


        <button
          id="video-mute"
          class="video-control-button"
          type="button"
          aria-label="ミュート"
        >
          🔊
        </button>


        <button
          id="video-fullscreen"
          class="video-control-button"
          type="button"
          aria-label="全画面"
        >
          ⛶
        </button>

      </div>



      <!-- =================================================
           Work Information
      ================================================== -->

      <div class="modal-info">

        <p
          id="modal-category"
          class="modal-category"
        >
        </p>


        <h2 id="modal-title">
        </h2>


        <p
          id="modal-meta"
          class="modal-meta"
        >
        </p>


        <p
          id="modal-description"
          class="modal-description"
        >
        </p>

      </div>

    </div>

  </div>



  <!-- =====================================================
       About
  ====================================================== -->

  <section
    id="about"
    class="simple-section"
  >

    <div class="section-inner">

      <p class="section-label">
        ABOUT
      </p>


      <h2>
        名前
      </h2>


      <p>
        ここにプロフィールを書きます。
      </p>


      <p>
        絵を描く人を支えること、
        視覚や聴覚の心地よさ、
        作品がどのように見えるか、
        どのように構成すると伝わるか。
        そうしたことに興味があります。
      </p>

    </div>

  </section>



  <!-- =====================================================
       Contact
  ====================================================== -->

  <section
    id="contact"
    class="simple-section"
  >

    <div class="section-inner">

      <p class="section-label">
        CONTACT
      </p>


      <h2>
        Contact
      </h2>


      <p>
        email@example.com
      </p>

    </div>

  </section>



  <!-- =====================================================
       Edit Mode
  ====================================================== -->

  <div
    id="edit-indicator"
    class="edit-indicator"
  >
    EDIT MODE
  </div>


  <div
    id="edit-help"
    class="edit-help"
  >

    <p>
      E：編集モード
    </p>

    <p>
      S：保存
    </p>

    <p>
      ESC：編集終了
    </p>

  </div>



  <!-- =====================================================
       JavaScript
  ====================================================== -->

  <script src="js/main.js"></script>


</body>

</html>
